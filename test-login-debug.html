<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录调试测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
        .result {
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <h1>xPaste 管理后台登录调试</h1>
    
    <form id="loginForm">
        <div class="form-group">
            <label for="username">用户名:</label>
            <input type="text" id="username" value="admin" required>
        </div>
        
        <div class="form-group">
            <label for="password">密码:</label>
            <input type="password" id="password" value="password" required>
        </div>
        
        <button type="submit">登录</button>
    </form>
    
    <div id="result"></div>
    
    <h3>调试信息:</h3>
    <div id="debug"></div>
    
    <script>
        const API_BASE_URL = 'http://localhost:8081';
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');
            const debugDiv = document.getElementById('debug');
            
            try {
                debugDiv.innerHTML = '<p>正在发送登录请求...</p>';
                
                const response = await fetch(`${API_BASE_URL}/api/v1/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });
                
                debugDiv.innerHTML += `<p>响应状态: ${response.status}</p>`;
                
                const data = await response.json();
                debugDiv.innerHTML += `<p>响应数据: ${JSON.stringify(data, null, 2)}</p>`;
                
                if (response.ok) {
                    // 登录成功，保存token和用户信息
                    const { token, admin } = data.data;
                    localStorage.setItem('admin_token', token);
                    localStorage.setItem('admin_user', JSON.stringify(admin));
                    
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <h3>登录成功!</h3>
                        <p>Token: ${token.substring(0, 20)}...</p>
                        <p>用户: ${admin.username} (${admin.role})</p>
                        <p>已保存到 localStorage</p>
                    `;
                    
                    // 检查localStorage
                    debugDiv.innerHTML += `<p>localStorage token: ${localStorage.getItem('admin_token')?.substring(0, 20)}...</p>`;
                    debugDiv.innerHTML += `<p>localStorage user: ${localStorage.getItem('admin_user')}</p>`;
                    
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `<h3>登录失败</h3><p>${data.error || '未知错误'}</p>`;
                }
                
            } catch (error) {
                debugDiv.innerHTML += `<p>请求错误: ${error.message}</p>`;
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `<h3>网络错误</h3><p>${error.message}</p>`;
            }
        });
        
        // 页面加载时检查现有的localStorage
        window.addEventListener('load', () => {
            const debugDiv = document.getElementById('debug');
            const existingToken = localStorage.getItem('admin_token');
            const existingUser = localStorage.getItem('admin_user');
            
            debugDiv.innerHTML = `
                <p><strong>页面加载时的localStorage状态:</strong></p>
                <p>Token: ${existingToken ? existingToken.substring(0, 20) + '...' : '无'}</p>
                <p>User: ${existingUser || '无'}</p>
            `;
        });
    </script>
</body>
</html>
